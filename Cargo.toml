[package]
name = "rcct"
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
description = "Pure-Rust geometry foundations for an independent CAD kernel"
license = "Apache-2.0"
repository = "https://github.com/Muktidaya/rcct"
documentation = "https://docs.rs/rcct"
readme = "README.md"
keywords = ["cad", "geometry", "occt", "brep"]
categories = ["mathematics", "graphics"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "NOTICE.md", "LICENSE", "rust-toolchain.toml", "docs/**", "tools/**"]

[dependencies]

[package.metadata.docs.rs]
all-features = true
