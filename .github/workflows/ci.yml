name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / pinned Rust / debug + release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The downstream check also builds the v0.1.0 tag.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select project pin
        shell: bash
        run: echo "RCCT_TOOLCHAIN=$(python tools/release_toolchain.py --print)" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install "${{ env.RCCT_TOOLCHAIN }}" --profile minimal
      - name: Record compiler and architecture
        run: rustc +${{ env.RCCT_TOOLCHAIN }} --version --verbose
      - name: Debug tests and doctests
        run: cargo +${{ env.RCCT_TOOLCHAIN }} test --locked --offline --all-features
      - name: Release tests and doctests
        run: cargo +${{ env.RCCT_TOOLCHAIN }} test --locked --offline --all-features --release
      - name: Packaged crate and v0.1.0 downstream compatibility (both profiles)
        run: python tools/check_package.py --toolchain "${{ env.RCCT_TOOLCHAIN }}"

  quality:
    name: Quality / pinned Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select project pin
        shell: bash
        run: echo "RCCT_TOOLCHAIN=$(python tools/release_toolchain.py --print)" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install "${{ env.RCCT_TOOLCHAIN }}" --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +${{ env.RCCT_TOOLCHAIN }} fmt --all -- --check
      - name: Lint
        run: cargo +${{ env.RCCT_TOOLCHAIN }} clippy --locked --offline --all-targets --all-features -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +${{ env.RCCT_TOOLCHAIN }} doc --locked --offline --no-deps --all-features
      - name: Reproduce independent numerical fixtures
        run: python tools/generate_numeric_fixtures.py --check
      - name: Reproduce exact orientation fixtures
        run: python tools/generate_orientation_fixtures.py --check
      - name: Reproduce exact 3D orientation fixtures
        run: python tools/generate_orientation3_fixtures.py --check
      - name: Reproduce raw segment-plane fixtures
        run: python tools/generate_segment_plane_fixtures.py --check
      - name: Reproduce exact crossing-order fixtures
        run: python tools/generate_crossing_order_fixtures.py --check
      - name: Reproduce parameter enclosure fixtures
        run: python tools/generate_parameter_enclosures.py --check
      - name: Reproduce crossing coordinate enclosure fixtures
        run: python tools/generate_crossing_coordinate_enclosures.py --check
      - name: Reproduce crossing point ordering fixtures
        run: python tools/generate_crossing_point_order.py --check
      - name: Reproduce constructed orientation fixtures
        run: python tools/generate_constructed_orientation.py --check
      - name: Reproduce span query fixtures
        run: python tools/generate_span_query_fixtures.py --check
      - name: Reproduce Boolean triangle fixture
        run: python tools/generate_boolean_triangle_fixture.py --check
      - name: Reproduce rounded quadratic Bézier fixtures
        run: python tools/generate_bezier3_fixtures.py --check
      - name: Test release pin metadata handling offline
        run: python -m unittest discover -s tests -p test_release_toolchain.py
